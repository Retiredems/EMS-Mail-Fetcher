name: Build EMS Mail Fetcher

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.1.0, etc.
  workflow_dispatch:  # manual trigger from GitHub Actions tab

jobs:

  # ── Windows .exe ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Windows EXE
        run: pyinstaller email_archiver.spec --clean --noconfirm

      - name: Zip output
        run: |
          cd dist
          Compress-Archive -Path EMS_Mail_Fetcher -DestinationPath EMS_Mail_Fetcher_Windows.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMS_Mail_Fetcher_Windows
          path: dist/EMS_Mail_Fetcher_Windows.zip

  # ── macOS .app ────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build macOS app
        run: pyinstaller email_archiver.spec --clean --noconfirm

      - name: Zip app bundle
        run: |
          cd dist
          zip -r "EMS_Mail_Fetcher_macOS.zip" "EMS Mail Fetcher.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMS_Mail_Fetcher_macOS
          path: dist/EMS_Mail_Fetcher_macOS.zip

  # ── GitHub Release (only on tag push) ────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EMS_Mail_Fetcher_Windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: EMS_Mail_Fetcher_macOS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EMS_Mail_Fetcher_Windows.zip
            EMS_Mail_Fetcher_macOS.zip
          generate_release_notes: true
